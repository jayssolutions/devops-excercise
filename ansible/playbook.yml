---
- name: Configure centralized logging (Elasticsearch, Logstash, Kibana)
  hosts: logging
  become: true

  tasks:
    - name: Check for existing swap file
      ansible.builtin.stat:
        path: /swapfile
      register: swapfile_stat

    - name: Create 1G swap file (t3.micro's 1GiB RAM is tight for ES+Logstash+Kibana together)
      block:
        - name: Allocate swap file
          ansible.builtin.command: fallocate -l 1G /swapfile
        - name: Restrict swap file permissions
          ansible.builtin.file:
            path: /swapfile
            mode: "0600"
        - name: Format swap file
          ansible.builtin.command: mkswap /swapfile
        - name: Enable swap file
          ansible.builtin.command: swapon /swapfile
        - name: Persist swap file in fstab
          ansible.builtin.lineinfile:
            path: /etc/fstab
            line: "/swapfile none swap sw 0 0"
      when: not swapfile_stat.stat.exists
    - name: Add Elastic yum repository
      ansible.builtin.include_tasks: tasks/setup_elastic_repo.yml

    - name: Install Elasticsearch, Logstash, Kibana
      ansible.builtin.dnf:
        name:
          - "elasticsearch-{{ elastic_stack_version }}"
          - "logstash-{{ elastic_stack_version }}"
          - "kibana-{{ elastic_stack_version }}"
        state: present

    - name: Configure Elasticsearch (single-node, security disabled for this exercise)
      ansible.builtin.copy:
        dest: /etc/elasticsearch/elasticsearch.yml
        content: |
          cluster.name: devops-excercise-logging
          node.name: logging-node-1
          path.data: /var/lib/elasticsearch
          path.logs: /var/log/elasticsearch
          network.host: localhost
          discovery.type: single-node
          xpack.security.enabled: false
        mode: "0644"
      notify: Restart elasticsearch

    - name: Cap Elasticsearch JVM heap for the demo-sized instance
      ansible.builtin.copy:
        dest: /etc/elasticsearch/jvm.options.d/heap.options
        content: |
          -Xms256m
          -Xmx256m
        mode: "0644"
      notify: Restart elasticsearch
    
    - name: Cap Logstash JVM heap for the free-tier-eligible instance (t3.micro, 1GiB RAM)
      ansible.builtin.lineinfile:
        path: /etc/logstash/jvm.options
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: "^-Xms", line: "-Xms256m" }
        - { regexp: "^-Xmx", line: "-Xmx256m" }
      notify: Restart logstash

    - name: Persist vm.max_map_count for Elasticsearch
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-elasticsearch.conf
        content: "vm.max_map_count=262144\n"
        mode: "0644"

    - name: Apply vm.max_map_count immediately
      ansible.builtin.command: sysctl -w vm.max_map_count=262144
      changed_when: false

    - name: Configure Kibana
      ansible.builtin.lineinfile:
        path: /etc/kibana/kibana.yml
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^#?server.host:', line: 'server.host: "0.0.0.0"' }
        - { regexp: '^#?elasticsearch.hosts:', line: 'elasticsearch.hosts: ["http://localhost:9200"]' }
      notify: Restart kibana
    
    - name: Create systemd override directory for Kibana
      ansible.builtin.file:
        path: /etc/systemd/system/kibana.service.d
        state: directory
        mode: "0755"

    - name: Cap Kibana's Node.js heap via systemd override
      ansible.builtin.copy:
        dest: /etc/systemd/system/kibana.service.d/heap.conf
        content: |
          [Service]
          Environment=NODE_OPTIONS=--max-old-space-size=256
        mode: "0644"
      notify: Restart kibana

    - name: Deploy Logstash pipeline for application logs
      ansible.builtin.copy:
        dest: /etc/logstash/conf.d/app-logs.conf
        content: |
          input {
            beats {
              port => 5044
            }
          }

          filter {
            if [message] =~ /^\{.*\}$/ {
              json {
                source => "message"
              }
            }
          }

          output {
            elasticsearch {
              hosts => ["http://localhost:9200"]
              index => "devops-excercise-app-logs-%{+YYYY.MM.dd}"
            }
          }
        mode: "0644"
      notify: Restart logstash

    - name: Start Elasticsearch, surfacing diagnostics on failure
      block:
        - name: Enable and start Elasticsearch
          ansible.builtin.systemd:
            name: elasticsearch
            enabled: true
            state: started
            daemon_reload: true
      rescue:
        - name: Capture Elasticsearch journal for diagnostics
          ansible.builtin.command: journalctl -u elasticsearch --no-pager -n 100
          register: es_journal
          changed_when: false
        - name: Show Elasticsearch journal
          ansible.builtin.debug:
            var: es_journal.stdout_lines
        - name: Fail with diagnostics surfaced above
          ansible.builtin.fail:
            msg: "Elasticsearch failed to start; see journal output above."

    - name: Wait for Elasticsearch to be ready
      ansible.builtin.uri:
        url: http://localhost:9200/_cluster/health
        status_code: 200
      register: es_health
      until: es_health.status == 200
      retries: 30
      delay: 5

    - name: Enable and start Kibana
      ansible.builtin.systemd:
        name: kibana
        enabled: true
        state: started
        daemon_reload: true

    - name: Enable and start Logstash
      ansible.builtin.systemd:
        name: logstash
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart elasticsearch
      ansible.builtin.systemd:
        name: elasticsearch
        state: restarted
        daemon_reload: true

    - name: Restart kibana
      ansible.builtin.systemd:
        name: kibana
        state: restarted
        daemon_reload: true

    - name: Restart logstash
      ansible.builtin.systemd:
        name: logstash
        state: restarted
        daemon_reload: true

- name: Configure and deploy Node.js application
  hosts: app
  become: true
  serial: 1

  vars:
    app_name: devops-excercise
    app_dir: /opt/devops-excercise
    app_port: 3000
    app_archive: "{{ lookup('env', 'APP_ARCHIVE') | default('../app.tar.gz', true) }}"

  tasks:
    - name: Install Node.js and npm
      ansible.builtin.dnf:
        name:
          - nodejs
          - npm
          - tar
        state: present

    - name: Create application user
      ansible.builtin.user:
        name: "{{ app_name }}"
        system: true
        shell: /sbin/nologin

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_name }}"
        group: "{{ app_name }}"
        mode: "0755"

    - name: Copy application archive
      ansible.builtin.copy:
        src: "{{ app_archive }}"
        dest: /tmp/app.tar.gz
        mode: "0644"

    - name: Extract application
      ansible.builtin.unarchive:
        src: /tmp/app.tar.gz
        dest: "{{ app_dir }}"
        remote_src: true
        owner: "{{ app_name }}"
        group: "{{ app_name }}"

    - name: Install production dependencies
      community.general.npm:
        path: "{{ app_dir }}"
        production: true
      become_user: "{{ app_name }}"

    - name: Install systemd service
      ansible.builtin.template:
        src: templates/app.service.j2
        dest: "/etc/systemd/system/{{ app_name }}.service"
        mode: "0644"
      notify: Restart application

    - name: Ensure service is running
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        enabled: true
        state: started
        daemon_reload: true

    - name: Add Elastic yum repository
      ansible.builtin.include_tasks: tasks/setup_elastic_repo.yml

    - name: Install Filebeat
      ansible.builtin.dnf:
        name: "filebeat-{{ elastic_stack_version }}"
        state: present

    - name: Configure Filebeat to ship application journal logs to Logstash
      ansible.builtin.copy:
        dest: /etc/filebeat/filebeat.yml
        content: |
          filebeat.inputs:
            - type: journald
              id: {{ app_name }}
              units:
                - "{{ app_name }}.service"

          output.logstash:
            hosts: ["{{ logging_host }}:5044"]
        mode: "0644"
      notify: Restart filebeat

    - name: Enable and start Filebeat
      ansible.builtin.systemd:
        name: filebeat
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart application
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        state: restarted
        daemon_reload: true

    - name: Restart filebeat
      ansible.builtin.systemd:
        name: filebeat
        state: restarted
        daemon_reload: true
